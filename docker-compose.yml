services:
  # ── Application (PHP-FPM + Nginx + Supervisor) ────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: ketahanan_app
    restart: unless-stopped
    ports:
      - "8080:80"        # Access app at http://localhost:8080
    environment:
      APP_NAME: "Ketahanan Pangan"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY}          # Set in .env.docker
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sdmapps
      DB_USERNAME: ketahanan
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ketahanan_net

  # ── MySQL Database ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ketahanan_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sdmapps
      MYSQL_USER: ketahanan
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3307:3306"      # Exposed on 3307 to avoid conflict with local MySQL
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ketahanan", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ketahanan_net

  # ── phpMyAdmin (optional, for DB management) ──────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ketahanan_pma
    restart: unless-stopped
    ports:
      - "8081:80"        # Access at http://localhost:8081
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    depends_on:
      - db
    networks:
      - ketahanan_net

# ── Named Volumes ──────────────────────────────────────────
volumes:
  db_data:
  app_storage:
  app_cache:

# ── Networks ───────────────────────────────────────────────
networks:
  ketahanan_net:
    driver: bridge
