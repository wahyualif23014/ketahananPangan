# ============================================================
#  Nginx Configuration — Ketahanan Pangan
# ============================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Performance ─────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Upload limits ───────────────────────────────────────
    client_max_body_size 100M;
    client_body_buffer_size 16k;

    # ── Gzip compression ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ── Logging ─────────────────────────────────────────────
    access_log /dev/stdout;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        # ── Security headers ────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Vite build assets (long cache) ──────────────────
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── Storage symlink (public uploads) ────────────────
        location /storage/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # ── Static assets ──────────────────────────────────
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # ── Favicon (suppress logs) ────────────────────────
        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        # ── Robots.txt ─────────────────────────────────────
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        # ── Laravel routing ────────────────────────────────
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── PHP-FPM ────────────────────────────────────────
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;

            # Timeouts
            fastcgi_read_timeout 300;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 300;

            # Buffers
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_busy_buffers_size 32k;
        }

        # ── Block hidden files (.env, .git, etc.) ──────────
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
