# ============================================================
#  Docker Compose — Ketahanan Pangan (Production Overlay)
# ============================================================
#
#  Usage:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
#  This file overrides the base docker-compose.yml for production.
#  - Removes bind mounts (uses image-baked code)
#  - Removes node service
#  - Adds queue worker and scheduler
#  - Enforces restart policies and resource limits
#
# ============================================================

services:

  # ── Override App for Production ───────────────────────────
  app:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "true"
      CONTAINER_ROLE: app
    volumes:
      # Production: only named volumes, no bind mounts
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M

  # ── Override DB for Production ────────────────────────────
  db:
    restart: always
    ports: []   # Don't expose DB port in production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ── Remove Node service in Production ─────────────────────
  node:
    profiles:
      - never   # Effectively disables this service

  # ── Remove phpMyAdmin in Production ───────────────────────
  phpmyadmin:
    profiles:
      - tools   # Only start with: docker compose --profile tools up phpmyadmin

  # ── Queue Worker (Production) ─────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: ketahanan_queue
    restart: always
    env_file:
      - .env.docker
    environment:
      APP_NAME: "Ketahanan Pangan"
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sdmapps
      DB_USERNAME: ketahanan
      QUEUE_CONNECTION: database
      CONTAINER_ROLE: queue
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ketahanan_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Scheduler (Production) ───────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: ketahanan_scheduler
    restart: always
    env_file:
      - .env.docker
    environment:
      APP_NAME: "Ketahanan Pangan"
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sdmapps
      DB_USERNAME: ketahanan
      CONTAINER_ROLE: scheduler
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ketahanan_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
